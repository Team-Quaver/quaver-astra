name: build

on:
  push:
    branches: [astra-native]
    tags: ["v*"]
  pull_request:
    branches: [astra-native]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go test ./internal/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, ext: "" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, ext: "" }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: ".exe" }
          - { os: macos-latest, goos: darwin, goarch: arm64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o quaver-astra-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: quaver-astra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: quaver-astra-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
