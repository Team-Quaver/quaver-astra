name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # 播放后端是 mpv 外部进程；装上它才能跑真实往返测试。
      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y mpv
      - run: go test ./internal/...
      # 无声卡的 runner 上用 null AO 验证 IPC 与时间轴
      - name: Test mpv engine
        env:
          QAA_TEST_MPV: "1"
          QAA_MPV_AO: "null"
        run: go test -run TestEngineRealMPV -v ./internal/audio/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, ext: "" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, ext: "" }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: ".exe" }
          - { os: macos-latest, goos: darwin, goarch: arm64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o quaver-astra-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: quaver-astra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: quaver-astra-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
